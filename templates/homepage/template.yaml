id: homepage
version: "1.0.0"
name_en: Homepage
name_es: Homepage
name_ca: Homepage
description_en: Customisable dashboard for all your services.
description_es: Panel personalizable para todos tus servicios.
description_ca: Tauler personalitzable per a tots els teus serveis.
image: ghcr.io/gethomepage/homepage:v0.10.9
service: app
port: 3000
ram_mb: 256
compose: |
  services:
    app:
      image: {{image}}
      restart: unless-stopped
      ports:
        - "127.0.0.1:{{host_port}}:{{port}}"
      environment:
        HOMEPAGE_ALLOWED_HOSTS: "{{domain}}"
      volumes:
        - homepage_config:/app/config
  volumes:
    homepage_config:
