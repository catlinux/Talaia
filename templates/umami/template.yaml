id: umami
version: "1.0.0"
name_en: Umami
name_es: Umami
name_ca: Umami
description_en: Privacy-friendly web analytics.
description_es: Analítica web respetuosa con la privacidad.
description_ca: Analítica web respectuosa amb la privacitat.
image: ghcr.io/umami-software/umami:postgresql-v2.14.0
service: app
port: 3000
ram_mb: 512
compose: |
  services:
    app:
      image: {{image}}
      restart: unless-stopped
      ports:
        - "127.0.0.1:{{host_port}}:{{port}}"
      environment:
        DATABASE_URL: "postgresql://umami:{{password:32}}@db:5432/umami"
        APP_SECRET: "{{password:32}}"
        BASE_URL: "https://{{domain}}"
    db:
      image: postgres:17.2-alpine
      restart: unless-stopped
      environment:
        POSTGRES_DB: "umami"
        POSTGRES_USER: "umami"
        POSTGRES_PASSWORD: "{{password:32}}"
      volumes:
        - umami_db:/var/lib/postgresql/data
  volumes:
    umami_db:
