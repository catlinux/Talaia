id: uptime-kuma
version: "1.0.0"
name_en: Uptime Kuma
name_es: Uptime Kuma
name_ca: Uptime Kuma
description_en: Self-hosted uptime monitor with status pages and notifications.
description_es: Monitor de disponibilidad autoalojado con páginas de estado y avisos.
description_ca: Monitor de disponibilitat autoallotjat amb pàgines d’estat i avisos.
image: louislam/uptime-kuma:1.23.16
service: app
port: 3001
ram_mb: 512
compose: |
  services:
    app:
      image: {{image}}
      restart: unless-stopped
      ports:
        - "127.0.0.1:{{host_port}}:{{port}}"
      environment:
        UPTIME_KUMA_URL: "https://{{domain}}"
      volumes:
        - uptime_data:/app/data
  volumes:
    uptime_data:
