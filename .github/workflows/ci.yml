name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [core, agent, cli, proto]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [core, agent, cli]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}

  proto:
    name: proto
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Lint the contract
        uses: bufbuild/buf-action@v1.6.0
        with:
          input: proto
          lint: true
          breaking: false
          push: false
          pr_comment: false
      - name: Check that the generated code is up to date
        working-directory: proto
        run: |
          buf generate
          git diff --exit-code gen

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format
      - name: Test
        run: pnpm test

  i18n:
    name: i18n
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Check the translation key sets
        run: node scripts/i18n-check.mjs
      - name: Test the i18n check
        run: node --test scripts

  hostd:
    name: installer and host helper
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Test the installer
        run: bash -n install-core.sh && bash packaging/core/test-install.sh
      - name: Test talaia-hostd
        run: bash packaging/core/hostd/test.sh

  core-stack:
    name: core stack (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Occupy 8443 so the installer has to choose other ports
        run: |
          nohup python3 -m http.server 8443 --bind 0.0.0.0 >/dev/null 2>&1 &
          sleep 1
      - name: Install the core with the installer
        run: bash packaging/core/install.sh --hostname 127.0.0.1 --no-user
      - name: The installer chose free ports
        run: |
          set -eu
          . packaging/core/.env
          test "$TALAIA_PANEL_PORT" != 8443
          test "$TALAIA_AGENT_PORT" != 8443
          test "$TALAIA_PANEL_PORT" != "$TALAIA_AGENT_PORT"
          echo "PANEL_PORT=$TALAIA_PANEL_PORT" >> "$GITHUB_ENV"
          echo "AGENT_PORT=$TALAIA_AGENT_PORT" >> "$GITHUB_ENV"
      - name: A busy port given on the command line is refused
        run: |
          set -eu
          rm -rf "$RUNNER_TEMP/clone" && mkdir "$RUNNER_TEMP/clone"
          cp -r packaging "$RUNNER_TEMP/clone/"
          rm -f "$RUNNER_TEMP/clone/packaging/core/.env"
          if bash "$RUNNER_TEMP/clone/packaging/core/install.sh" --hostname 127.0.0.1 --port 8443 --no-user 2>"$RUNNER_TEMP/err.txt"; then
            echo "the installer accepted a busy port"; exit 1
          fi
          grep -q 'port 8443 is already in use' "$RUNNER_TEMP/err.txt"
      - name: The core serves the panel, the CA, the installer and the agent packages
        run: |
          set -eu
          panel="https://127.0.0.1:$PANEL_PORT"
          url="https://127.0.0.1:$AGENT_PORT"
          test "$(curl -sk -o /dev/null -w '%{http_code}' "$panel/")" = 200
          # Each port serves only its own routes.
          test "$(curl -sk -o /dev/null -w '%{http_code}' "$url/")" = 404
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST "$panel/enroll")" != 200
          curl -fsk -o "$RUNNER_TEMP/ca.pem" "$url/ca.pem"
          curl -fsk "$url/install.sh" | head -n 1 | grep -q '^#!/usr/bin/env bash'
          # The packages are downloaded the way install.sh does it: trusting the CA only.
          for arch in amd64 arm64; do
            curl -fs --cacert "$RUNNER_TEMP/ca.pem" -o "$RUNNER_TEMP/agent_$arch.deb" "$url/agent/talaia-agent_$arch.deb"
            dpkg-deb --info "$RUNNER_TEMP/agent_$arch.deb" | grep -q "Architecture: $arch"
          done
      - name: token create prints the install command
        working-directory: packaging/core
        run: |
          set -eu
          docker compose run --rm -T core token create --name ci | tee "$RUNNER_TEMP/token.txt"
          grep -q 'sha256sum -c - && sudo bash' "$RUNNER_TEMP/token.txt"
      - name: Install the agent with the printed command and check it enrolls
        working-directory: packaging/core
        run: |
          set -eu
          command="$(grep '^f=$(mktemp) && curl -fsSk ' "$RUNNER_TEMP/token.txt")"
          bash -c "$command"
          for _ in $(seq 1 30); do
            if sudo journalctl -u talaia-agent --no-pager | grep -q 'connected to core'; then
              break
            fi
            sleep 2
          done
          sudo journalctl -u talaia-agent --no-pager | grep -q 'enrolled with the core'
          sudo journalctl -u talaia-agent --no-pager | grep -q 'connected to core'
          test "$(docker compose exec -T db psql -U talaia -d talaia -tAc "SELECT count(*) FROM server WHERE name = 'ci'" | tr -d '[:space:]')" = 1
      - name: Upgrade the agent with the printed command
        working-directory: packaging/core
        run: |
          set -eu
          docker compose run --rm -T core server upgrade-command | tee "$RUNNER_TEMP/upgrade.txt"
          command="$(grep '^f=$(mktemp) && curl -fsSk ' "$RUNNER_TEMP/upgrade.txt")"
          bash -c "$command"
          sudo systemctl is-active --quiet talaia-agent
          test "$(sudo journalctl -u talaia-agent --no-pager | grep -c 'starting talaia-agent')" -ge 2
          # The agent kept its identity: no second server was created.
          test "$(docker compose exec -T db psql -U talaia -d talaia -tAc "SELECT count(*) FROM server" | tr -d '[:space:]')" = 1
      - name: The host helper takes a request written as the core user
        run: |
          set -eu
          test "$(stat -c %u /var/lib/talaia-host/requests)" = 65532
          test "$(stat -c %u /var/lib/talaia-host)" = 0
          sudo systemctl is-active --quiet talaia-update.path
          sha="$(git rev-parse HEAD)"
          sudo setpriv --reuid=65532 --regid=65532 --clear-groups \
            sh -c "printf '{\"target\":\"%s\"}' '$sha' > /var/lib/talaia-host/requests/update.json"
          for _ in $(seq 1 30); do
            if grep -q '"state":"succeeded"' /var/lib/talaia-host/status.json 2>/dev/null; then
              break
            fi
            sleep 2
          done
          grep -q "already at ${sha:0:12}" /var/lib/talaia-host/status.json
          test ! -e /var/lib/talaia-host/requests/update.json
      - name: Logs on failure
        if: failure()
        working-directory: packaging/core
        run: |
          docker compose logs --no-color
          sudo journalctl -u talaia-agent --no-pager || true
          sudo journalctl -u talaia-update --no-pager || true
