name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [core, agent, cli, proto]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [core, agent, cli]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}

  proto:
    name: proto
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Lint the contract
        uses: bufbuild/buf-action@v1.6.0
        with:
          input: proto
          lint: true
          breaking: false
          push: false
          pr_comment: false
      - name: Check that the generated code is up to date
        working-directory: proto
        run: |
          buf generate
          git diff --exit-code gen

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format
      - name: Test
        run: pnpm test

  i18n:
    name: i18n
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Check the translation key sets
        run: node scripts/i18n-check.mjs
      - name: Test the i18n check
        run: node --test scripts
