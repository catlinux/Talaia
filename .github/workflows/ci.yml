name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [core, agent, cli, proto]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [core, agent, cli]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}

  proto:
    name: proto
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Lint the contract
        uses: bufbuild/buf-action@v1.6.0
        with:
          input: proto
          lint: true
          breaking: false
          push: false
          pr_comment: false
      - name: Check that the generated code is up to date
        working-directory: proto
        run: |
          buf generate
          git diff --exit-code gen

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format
      - name: Test
        run: pnpm test

  i18n:
    name: i18n
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Check the translation key sets
        run: node scripts/i18n-check.mjs
      - name: Test the i18n check
        run: node --test scripts

  core-stack:
    name: core stack (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Install the core with the installer
        run: bash packaging/core/install.sh --hostname 127.0.0.1 --port 8443 --no-user
      - name: The core serves the panel, the CA, the installer and the agent packages
        run: |
          set -eu
          url=https://127.0.0.1:8443
          test "$(curl -sk -o /dev/null -w '%{http_code}' "$url/")" = 200
          curl -fsk -o "$RUNNER_TEMP/ca.pem" "$url/ca.pem"
          curl -fsk "$url/install.sh" | head -n 1 | grep -q '^#!/usr/bin/env bash'
          # The packages are downloaded the way install.sh does it: trusting the CA only.
          for arch in amd64 arm64; do
            curl -fs --cacert "$RUNNER_TEMP/ca.pem" -o "$RUNNER_TEMP/agent_$arch.deb" "$url/agent/talaia-agent_$arch.deb"
            dpkg-deb --info "$RUNNER_TEMP/agent_$arch.deb" | grep -q "Architecture: $arch"
          done
      - name: token create prints the install command
        working-directory: packaging/core
        run: |
          set -eu
          docker compose run --rm -T core token create --name ci | tee "$RUNNER_TEMP/token.txt"
          grep -q 'curl -fsSk https://127.0.0.1:8443/install.sh | sudo bash -s -- --url https://127.0.0.1:8443 --token ' "$RUNNER_TEMP/token.txt"
      - name: Install the agent with the printed command and check it enrolls
        working-directory: packaging/core
        run: |
          set -eu
          command="$(grep '^curl -fsSk ' "$RUNNER_TEMP/token.txt")"
          bash -c "$command"
          for _ in $(seq 1 30); do
            if sudo journalctl -u talaia-agent --no-pager | grep -q 'connected to core'; then
              break
            fi
            sleep 2
          done
          sudo journalctl -u talaia-agent --no-pager | grep -q 'enrolled with the core'
          sudo journalctl -u talaia-agent --no-pager | grep -q 'connected to core'
          test "$(docker compose exec -T db psql -U talaia -d talaia -tAc "SELECT count(*) FROM server WHERE name = 'ci'" | tr -d '[:space:]')" = 1
      - name: Logs on failure
        if: failure()
        working-directory: packaging/core
        run: |
          docker compose logs --no-color
          sudo journalctl -u talaia-agent --no-pager || true
