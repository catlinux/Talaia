// Contract between talaia-core and talaia-agent (v0).
// Rules: fields are added, never renumbered or reused. Typed commands only.
syntax = "proto3";

package talaia.agent.v1;

import "google/protobuf/timestamp.proto";

// The agent opens the stream (outbound only); both sides then exchange messages.
service AgentHub {
  rpc Connect(stream AgentMsg) returns (stream CoreMsg);
}

// core -> agent
message CoreMsg {
  // Idempotency key of the command; empty for plain acknowledgements.
  string job_id = 1;
  oneof cmd {
    HeartbeatAck heartbeat_ack = 2;
    // Numbers 10 and above are for typed commands (compose_up, exec_pty,
    // apt_upgrade, read_logs…), added phase by phase.
    ContainerAction container_action = 10;
    ReadLogs read_logs = 11;
    StackWrite stack_write = 12;
    StackAction stack_action = 13;
    StackRead stack_read = 14;
    StackAdopt stack_adopt = 15;
    ListResources list_resources = 16;
    RemoveResources remove_resources = 17;
    // Terminal sessions are not jobs: they carry no job_id and live as long as
    // the session does.
    TerminalOpen terminal_open = 18;
    TerminalInput terminal_input = 19;
    TerminalResize terminal_resize = 20;
    TerminalClose terminal_close = 21;
    AgentUpdate agent_update = 22;
    ServiceAction service_action = 23;
    ReadJournal read_journal = 24;
    AptStatus apt_status = 25;
    AptUpgrade apt_upgrade = 26;
    HostReboot host_reboot = 27;
  }
}

// agent -> core
message AgentMsg {
  oneof msg {
    Heartbeat heartbeat = 1; // every 10 s
    Metrics metrics = 2;     // every 15 s
    JobEvent job_event = 3;  // progress and result of a command
    Inventory inventory = 4; // on connect and on change
    ContainerStats container_stats = 5; // every 15 s while Docker is available
    TerminalOpened terminal_opened = 6;
    TerminalOutput terminal_output = 7;
    TerminalClosed terminal_closed = 8;
  }
}

// ContainerAction starts, stops, restarts or removes one container. The agent
// runs exactly this and nothing else; it never builds a shell command.
message ContainerAction {
  // Container id (hex, 12 to 64 characters) or name.
  string container = 1;
  ContainerActionType action = 2;
}

enum ContainerActionType {
  CONTAINER_ACTION_TYPE_UNSPECIFIED = 0;
  CONTAINER_ACTION_TYPE_START = 1;
  CONTAINER_ACTION_TYPE_STOP = 2;
  CONTAINER_ACTION_TYPE_RESTART = 3;
  // Removes the container; its volumes are kept.
  CONTAINER_ACTION_TYPE_REMOVE = 4;
}

// ReadLogs asks for the last lines of a container's output (stdout and stderr).
message ReadLogs {
  // Container id (hex, 12 to 64 characters) or name.
  string container = 1;
  // How many lines from the end; the agent clamps it to 1..1000.
  uint32 tail = 2;
  // Optional RFC 3339 timestamp: only lines after it are returned. Empty means
  // no lower limit.
  string since = 3;
  // Prefix each line with its timestamp (docker logs --timestamps).
  bool timestamps = 4;
}

// StackWrite validates a Compose project and stores it as the managed stack
// <name>. It does not start anything: StackAction does.
message StackWrite {
  // Stack name: lower case letters, digits, dash and underscore, 1 to 63 characters.
  string name = 1;
  // Contents of compose.yaml.
  string compose_yaml = 2;
  // Contents of the .env file next to it; may be empty.
  string env = 3;
}

// StackAction runs a docker compose operation on a managed stack.
message StackAction {
  string name = 1;
  StackActionType action = 2;
}

enum StackActionType {
  STACK_ACTION_TYPE_UNSPECIFIED = 0;
  // docker compose up -d --remove-orphans
  STACK_ACTION_TYPE_UP = 1;
  // docker compose down; volumes are kept.
  STACK_ACTION_TYPE_DOWN = 2;
  // docker compose pull
  STACK_ACTION_TYPE_PULL = 3;
  // docker compose restart
  STACK_ACTION_TYPE_RESTART = 4;
  // docker compose down and deletion of the stack files; volumes are kept.
  STACK_ACTION_TYPE_REMOVE = 5;
  // Stops managing an adopted stack: only the record of Talaia is deleted; the
  // containers and the files stay as they are.
  STACK_ACTION_TYPE_FORGET = 6;
}

// StackAdopt makes Talaia manage a Compose project that is already running. The
// agent finds the project by its name among its containers and records where its
// files are; the core never sends a path.
message StackAdopt {
  string name = 1;
}

// StackRead returns the files of a managed stack as the JSON output of the job
// ({"compose": "...", "env": "..."}).
message StackRead {
  string name = 1;
}

// ResourceKind is a kind of Docker resource the panel can list and clean up.
enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  RESOURCE_KIND_IMAGE = 1;
  RESOURCE_KIND_VOLUME = 2;
  RESOURCE_KIND_NETWORK = 3;
}

// ListResources lists the resources of one kind with whether a container uses
// each. The list comes back as the JSON output of the job.
message ListResources {
  ResourceKind kind = 1;
}

// ResourceRef points at one resource: an image id, a volume name or a network id.
message ResourceRef {
  ResourceKind kind = 1;
  string id = 2;
}

// RemoveResources removes the given resources one by one, without force: Docker
// refuses the ones that are in use. The per-resource results come back as the
// JSON output of the job.
message RemoveResources {
  repeated ResourceRef items = 1;
}

// AgentUpdate asks the agent to download and install a newer agent package. The
// agent checks the package against sha256 before installing it.
message AgentUpdate {
  // Version in the form x.y.z; it must be newer than the running agent.
  string version = 1;
  // SHA-256 of the .deb, as 64 hexadecimal characters.
  string sha256 = 2;
}

// ServiceAction acts on one systemd service unit. The agent runs systemctl with
// the unit as a separate argument and returns the new state as the JSON output
// of the job. It refuses to stop, restart or disable talaia-agent.service.
message ServiceAction {
  // Unit name ending in .service, as reported in Inventory.services.
  string unit = 1;
  ServiceActionType action = 2;
}

enum ServiceActionType {
  SERVICE_ACTION_TYPE_UNSPECIFIED = 0;
  SERVICE_ACTION_TYPE_START = 1;
  SERVICE_ACTION_TYPE_STOP = 2;
  SERVICE_ACTION_TYPE_RESTART = 3;
  SERVICE_ACTION_TYPE_RELOAD = 4;
  SERVICE_ACTION_TYPE_ENABLE = 5;
  SERVICE_ACTION_TYPE_DISABLE = 6;
}

// ReadJournal reads journald entries with filters. The entries and the cursor to
// continue from come back as the JSON output of the job.
message ReadJournal {
  // A service unit from Inventory.services; empty reads every unit.
  string unit = 1;
  // Highest priority level shown, 0 (emerg) to 7 (debug); unset shows all.
  optional uint32 max_priority = 2;
  // RFC 3339 timestamps; empty means no limit.
  string since = 3;
  string until = 4;
  // Literal text, case-insensitive, at most 200 characters; empty means no search.
  string search = 5;
  JournalBoot boot = 6;
  // How many entries from the end; the agent clamps it to 1..1000 (200 if 0).
  uint32 tail = 7;
  // Cursor returned by a previous read: only newer entries come back.
  string after_cursor = 8;
}

enum JournalBoot {
  // Every boot the journal keeps.
  JOURNAL_BOOT_UNSPECIFIED = 0;
  JOURNAL_BOOT_CURRENT = 1;
  JOURNAL_BOOT_PREVIOUS = 2;
}

// AptStatus lists the pending updates, held packages and whether a reboot is
// required, as the JSON output of the job.
message AptStatus {
  // Run apt-get update first to download fresh package lists.
  bool refresh = 1;
}

// AptUpgrade upgrades packages without removing any. The agent works out the
// package list itself; the core never sends package names.
message AptUpgrade {
  AptUpgradeMode mode = 1;
}

enum AptUpgradeMode {
  APT_UPGRADE_MODE_UNSPECIFIED = 0;
  // Only the packages coming from a security archive.
  APT_UPGRADE_MODE_SECURITY = 1;
  // apt-get upgrade --with-new-pkgs.
  APT_UPGRADE_MODE_ALL = 2;
}

// HostReboot reboots the server a few seconds after the job succeeds. There is
// no power-off: Talaia could not turn the server on again.
message HostReboot {
  // Must equal the hostname of the agent, so a command can never reboot the
  // wrong machine.
  string hostname = 1;
}

// JobEvent reports how a command (identified by CoreMsg.job_id) is going.
message JobEvent {
  string job_id = 1;
  JobState state = 2;
  // Short human-readable detail, for example the error of the Docker Engine.
  string message = 3;
  google.protobuf.Timestamp at = 4;
  // Text the command produced, for example the lines of a log; bounded by the agent.
  string output = 5;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_RUNNING = 1;
  JOB_STATE_SUCCEEDED = 2;
  JOB_STATE_FAILED = 3;
}

message Heartbeat {
  // Monotonic per connection, lets the core detect gaps.
  uint64 seq = 1;
  google.protobuf.Timestamp sent_at = 2;
}

message HeartbeatAck {
  uint64 seq = 1;
}

message Inventory {
  string hostname = 1;
  string os_name = 2;     // e.g. "Debian GNU/Linux"
  string os_version = 3;  // e.g. "13"
  string kernel = 4;
  string arch = 5;        // "amd64" | "arm64"
  string agent_version = 6;
  uint32 cpu_count = 7;
  uint64 mem_total_bytes = 8;
  // False when the Docker socket is missing or unreachable; the lists below are then empty.
  bool docker_available = 9;
  string docker_version = 10;
  repeated Container containers = 11;
  repeated ComposeProject compose_projects = 12;
  repeated SystemdUnit services = 13;
  // Names of the stacks Talaia manages on this server (directories of
  // /opt/talaia/stacks that hold a compose.yaml).
  repeated string managed_stacks = 14;
  // The managed stacks that were adopted: they stay where they were and Talaia
  // only points at them. A subset of managed_stacks.
  repeated string adopted_stacks = 15;
  // The adopted stacks whose compose file or directory no longer exists on the
  // host. A subset of adopted_stacks; the panel only lets them be forgotten.
  repeated string broken_stacks = 16;
  // Pending package updates; unset when the host has no apt.
  AptSummary apt = 17;
  // True when the agent accepts terminal sessions on the host itself
  // ([terminal] host in agent.toml). Older agents leave it false.
  bool host_terminal = 18;
}

// AptSummary is what the panel shows without asking: the agent simulates an
// upgrade at start, every 6 hours and after each apt job. It never runs
// apt-get update by itself.
message AptSummary {
  uint32 upgradable = 1;      // packages an upgrade would install or change
  uint32 security = 2;        // of them, the ones coming from a security archive
  bool reboot_required = 3;
  google.protobuf.Timestamp checked_at = 4;
  // When the package lists were last downloaded (apt-get update); unset if unknown.
  google.protobuf.Timestamp lists_updated_at = 5;
}

message Container {
  string id = 1;              // short id (12 chars)
  string name = 2;            // without the leading slash
  string image = 3;
  string state = 4;           // running | exited | paused | restarting | created | dead
  string status = 5;          // human readable, as reported by Docker
  string compose_project = 6; // empty when not part of a Compose project
  string compose_service = 7;
}

message ComposeProject {
  string name = 1;
  string working_dir = 2;
  repeated string config_files = 3;
  uint32 container_count = 4;
  uint32 running_count = 5;
}

message SystemdUnit {
  string name = 1;         // e.g. "docker.service"
  string description = 2;
  string load_state = 3;   // loaded | not-found | masked ...
  string active_state = 4; // active | inactive | failed ...
  string sub_state = 5;    // running | exited | dead | failed ...
  string unit_file_state = 6; // enabled | disabled | static | masked ...; empty if unknown
}

// ContainerStats is the resource use of the running containers at one instant.
message ContainerStats {
  google.protobuf.Timestamp sampled_at = 1;
  repeated ContainerStat items = 2;
}

// ContainerStat is the use of one running container, like docker stats shows it.
message ContainerStat {
  string id = 1;               // short id (12 chars), as in Container.id
  double cpu_percent = 2;      // of one core: 100 means one full core
  uint64 mem_used_bytes = 3;   // without the cache the kernel can reclaim
  uint64 mem_limit_bytes = 4;  // 0 when the container has no limit
  uint64 net_rx_bytes = 5;     // cumulative, summed over its networks
  uint64 net_tx_bytes = 6;
}

// TerminalOpen starts an interactive shell in a container. The shell comes from
// a closed list; the agent never runs free text. session_id is chosen by the
// core (random, 128 bits) and routes every later message of the session.
message TerminalOpen {
  string session_id = 1;
  // Container id (hex, 12 to 64 characters) or name.
  string container = 2;
  TerminalShell shell = 3;
  uint32 cols = 4;
  uint32 rows = 5;
  // Where the shell runs. HOST opens a root shell on the server itself and
  // requires container to be empty.
  TerminalTarget target = 6;
}

enum TerminalTarget {
  // A container, as before this field existed.
  TERMINAL_TARGET_UNSPECIFIED = 0;
  TERMINAL_TARGET_CONTAINER = 1;
  TERMINAL_TARGET_HOST = 2;
}

enum TerminalShell {
  TERMINAL_SHELL_UNSPECIFIED = 0;
  TERMINAL_SHELL_SH = 1;   // /bin/sh
  TERMINAL_SHELL_BASH = 2; // /bin/bash
}

// TerminalInput carries keystrokes, at most 4 KiB per message. It is bytes, not
// text: a terminal does not speak only UTF-8.
message TerminalInput {
  string session_id = 1;
  bytes data = 2;
}

// TerminalResize changes the size of the terminal; cols and rows are 1 to 1000.
message TerminalResize {
  string session_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

// TerminalClose asks the agent to end a session.
message TerminalClose {
  string session_id = 1;
}

// TerminalOpened answers a TerminalOpen once the shell runs, or says why not.
message TerminalOpened {
  string session_id = 1;
  // The container is privileged, shares the PID namespace of the host or has
  // the Docker socket mounted: the shell is as good as root on the server.
  bool privileged = 2;
  string error = 3; // empty when the session opened
}

// TerminalOutput is what the shell printed, at most 16 KiB per message.
message TerminalOutput {
  string session_id = 1;
  bytes data = 2;
}

// TerminalClosed ends a session from the agent side: the shell exited, the
// container went away or a limit was reached.
message TerminalClosed {
  string session_id = 1;
  string reason = 2;
  int32 exit_code = 3;
}

message Metrics {
  google.protobuf.Timestamp sampled_at = 1;
  string hostname = 2;
  double cpu_percent = 3;       // 0-100, whole machine
  uint64 mem_used_bytes = 4;
  uint64 disk_used_bytes = 5;   // root filesystem
  uint64 disk_total_bytes = 6;
  // Cumulative counters since boot, summed over physical interfaces; the core derives rates.
  uint64 net_rx_bytes = 7;
  uint64 net_tx_bytes = 8;
}
