// Contract between talaia-core and talaia-agent (v0).
// Rules: fields are added, never renumbered or reused. Typed commands only.
syntax = "proto3";

package talaia.agent.v1;

import "google/protobuf/timestamp.proto";

// The agent opens the stream (outbound only); both sides then exchange messages.
service AgentHub {
  rpc Connect(stream AgentMsg) returns (stream CoreMsg);
}

// core -> agent
message CoreMsg {
  // Idempotency key of the command; empty for plain acknowledgements.
  string job_id = 1;
  oneof cmd {
    HeartbeatAck heartbeat_ack = 2;
    // Numbers 10 and above are reserved for typed commands
    // (compose_up, exec_pty, apt_upgrade, read_logs…), added in later phases.
  }
}

// agent -> core
message AgentMsg {
  // Field 3 is reserved for JobEvent (progress, output, result), added with the first command.
  reserved 3;
  reserved "job_event";
  oneof msg {
    Heartbeat heartbeat = 1; // every 10 s
    Metrics metrics = 2;     // every 15 s
    Inventory inventory = 4; // on connect and on change
  }
}

message Heartbeat {
  // Monotonic per connection, lets the core detect gaps.
  uint64 seq = 1;
  google.protobuf.Timestamp sent_at = 2;
}

message HeartbeatAck {
  uint64 seq = 1;
}

message Inventory {
  string hostname = 1;
  string os_name = 2;     // e.g. "Debian GNU/Linux"
  string os_version = 3;  // e.g. "13"
  string kernel = 4;
  string arch = 5;        // "amd64" | "arm64"
  string agent_version = 6;
  uint32 cpu_count = 7;
  uint64 mem_total_bytes = 8;
  // False when the Docker socket is missing or unreachable; the lists below are then empty.
  bool docker_available = 9;
  string docker_version = 10;
  repeated Container containers = 11;
  repeated ComposeProject compose_projects = 12;
  repeated SystemdUnit services = 13;
}

message Container {
  string id = 1;              // short id (12 chars)
  string name = 2;            // without the leading slash
  string image = 3;
  string state = 4;           // running | exited | paused | restarting | created | dead
  string status = 5;          // human readable, as reported by Docker
  string compose_project = 6; // empty when not part of a Compose project
  string compose_service = 7;
}

message ComposeProject {
  string name = 1;
  string working_dir = 2;
  repeated string config_files = 3;
  uint32 container_count = 4;
  uint32 running_count = 5;
}

message SystemdUnit {
  string name = 1;         // e.g. "docker.service"
  string description = 2;
  string load_state = 3;   // loaded | not-found | masked ...
  string active_state = 4; // active | inactive | failed ...
  string sub_state = 5;    // running | exited | dead | failed ...
}

message Metrics {
  google.protobuf.Timestamp sampled_at = 1;
  string hostname = 2;
  double cpu_percent = 3;       // 0-100, whole machine
  uint64 mem_used_bytes = 4;
  uint64 disk_used_bytes = 5;   // root filesystem
  uint64 disk_total_bytes = 6;
  // Cumulative counters since boot, summed over physical interfaces; the core derives rates.
  uint64 net_rx_bytes = 7;
  uint64 net_tx_bytes = 8;
}
