version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # The contract lives at proto/agent.proto, as documented in docs/en/architecture.md.
    - PACKAGE_DIRECTORY_MATCH
    # The stream carries AgentMsg/CoreMsg envelopes instead of per-RPC request/response types.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - SERVICE_SUFFIX
breaking:
  use:
    - FILE
