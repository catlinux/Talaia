# Talaia agent configuration.

# URL of the talaia-core the agent connects to (https only). packaging/install.sh
# writes core_url and ca_fingerprint here.
# core_url = "https://talaia.example.com"

# SHA-256 fingerprint (64 hex characters) of the core CA. It is the trust anchor
# of the first connection and comes with the enrollment token.
# ca_fingerprint = ""

# Log level: debug, info, warn or error.
log_level = "info"

# Allow root shells on the server itself from the panel. Set to false to report
# host_terminal = false and refuse them.
[terminal]
host = true
