[app.name]
other = "Talaia"

[app.starting]
other = "iniciando Talaia {{.Version}}"

[notify.test]
other = "Notificación de prueba de Talaia"
[notify.severity.warning]
other = "Aviso"
[notify.severity.critical]
other = "Crítico"
[notify.footer]
other = "Notificación enviada por Talaia"

[notify.server_offline.firing_title]
other = "[{{.Severity}}] {{.Server}} está sin conexión"
[notify.server_offline.firing_body]
other = "{{.Server}} ha dejado de informar a Talaia y se considera sin conexión."

[notify.server_offline.resolved_title]
other = "{{.Server}} vuelve a estar en línea"
[notify.server_offline.resolved_body]
other = "{{.Server}} vuelve a informar a Talaia."

[notify.cpu_high.firing_title]
other = "[{{.Severity}}] CPU alta en {{.Server}}"
[notify.cpu_high.firing_body]
other = "El uso de CPU de {{.Server}} está al {{.value}} %."

[notify.cpu_high.resolved_title]
other = "El uso de CPU de {{.Server}} vuelve a la normalidad"
[notify.cpu_high.resolved_body]
other = "El uso de CPU de {{.Server}} ha bajado del umbral."

[notify.mem_high.firing_title]
other = "[{{.Severity}}] Memoria alta en {{.Server}}"
[notify.mem_high.firing_body]
other = "El uso de memoria de {{.Server}} está al {{.value}} %."

[notify.mem_high.resolved_title]
other = "El uso de memoria de {{.Server}} vuelve a la normalidad"
[notify.mem_high.resolved_body]
other = "El uso de memoria de {{.Server}} ha bajado del umbral."

[notify.disk_high.firing_title]
other = "[{{.Severity}}] Disco casi lleno en {{.Server}}"
[notify.disk_high.firing_body]
other = "El disco raíz de {{.Server}} está al {{.value}} %."

[notify.disk_high.resolved_title]
other = "El uso de disco de {{.Server}} vuelve a la normalidad"
[notify.disk_high.resolved_body]
other = "El disco raíz de {{.Server}} ha bajado del umbral."

[notify.container_down.firing_title]
other = "[{{.Severity}}] El contenedor {{.Subject}} está parado en {{.Server}}"
[notify.container_down.firing_body]
other = "El contenedor {{.Subject}}{{if .Stack}} (stack {{.Stack}}){{end}} de {{.Server}} no está en marcha."

[notify.container_down.resolved_title]
other = "El contenedor {{.Subject}} vuelve a funcionar en {{.Server}}"
[notify.container_down.resolved_body]
other = "El contenedor {{.Subject}} de {{.Server}} vuelve a estar en marcha."

[notify.container_unhealthy.firing_title]
other = "[{{.Severity}}] El contenedor {{.Subject}} no está saludable en {{.Server}}"
[notify.container_unhealthy.firing_body]
other = "La comprobación de salud de {{.Subject}}{{if .Stack}} (stack {{.Stack}}){{end}} en {{.Server}} está fallando."

[notify.container_unhealthy.resolved_title]
other = "El contenedor {{.Subject}} vuelve a estar saludable en {{.Server}}"
[notify.container_unhealthy.resolved_body]
other = "La comprobación de salud de {{.Subject}} en {{.Server}} vuelve a pasar."

[notify.check_failed.firing_title]
other = "[{{.Severity}}] Comprobación fallida: {{.Subject}}"
[notify.check_failed.firing_body]
other = "La comprobación {{.Subject}} está fallando."

[notify.check_failed.resolved_title]
other = "La comprobación {{.Subject}} vuelve a funcionar"
[notify.check_failed.resolved_body]
other = "La comprobación {{.Subject}} vuelve a pasar."

[notify.cert_expiry.firing_title]
other = "[{{.Severity}}] Certificado a punto de caducar: {{.Subject}}"
[notify.cert_expiry.firing_body]
other = "El certificado de {{.Subject}} {{if le .days 0}}ha caducado{{else}}caduca en {{.days}} días{{end}}."

[notify.cert_expiry.resolved_title]
other = "Certificado de {{.Subject}} renovado"
[notify.cert_expiry.resolved_body]
other = "El certificado de {{.Subject}} ya no está a punto de caducar."
