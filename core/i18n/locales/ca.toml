[app.name]
other = "Talaia"

[app.starting]
other = "s'inicia Talaia {{.Version}}"

[notify.test]
other = "Notificació de prova de Talaia"
[notify.severity.warning]
other = "Avís"
[notify.severity.critical]
other = "Crític"
[notify.footer]
other = "Notificació enviada per Talaia"

[notify.server_offline.firing_title]
other = "[{{.Severity}}] {{.Server}} està fora de línia"
[notify.server_offline.firing_body]
other = "{{.Server}} ha deixat d'informar Talaia i es considera fora de línia."

[notify.server_offline.resolved_title]
other = "{{.Server}} torna a estar en línia"
[notify.server_offline.resolved_body]
other = "{{.Server}} torna a informar Talaia."

[notify.cpu_high.firing_title]
other = "[{{.Severity}}] CPU alta a {{.Server}}"
[notify.cpu_high.firing_body]
other = "L'ús de CPU de {{.Server}} és del {{.value}} %."

[notify.cpu_high.resolved_title]
other = "L'ús de CPU de {{.Server}} torna a la normalitat"
[notify.cpu_high.resolved_body]
other = "L'ús de CPU de {{.Server}} ha baixat del llindar."

[notify.mem_high.firing_title]
other = "[{{.Severity}}] Memòria alta a {{.Server}}"
[notify.mem_high.firing_body]
other = "L'ús de memòria de {{.Server}} és del {{.value}} %."

[notify.mem_high.resolved_title]
other = "L'ús de memòria de {{.Server}} torna a la normalitat"
[notify.mem_high.resolved_body]
other = "L'ús de memòria de {{.Server}} ha baixat del llindar."

[notify.disk_high.firing_title]
other = "[{{.Severity}}] Disc gairebé ple a {{.Server}}"
[notify.disk_high.firing_body]
other = "El disc arrel de {{.Server}} és al {{.value}} %."

[notify.disk_high.resolved_title]
other = "L'ús de disc de {{.Server}} torna a la normalitat"
[notify.disk_high.resolved_body]
other = "El disc arrel de {{.Server}} ha baixat del llindar."

[notify.container_down.firing_title]
other = "[{{.Severity}}] El contenidor {{.Subject}} està aturat a {{.Server}}"
[notify.container_down.firing_body]
other = "El contenidor {{.Subject}}{{if .Stack}} (stack {{.Stack}}){{end}} de {{.Server}} no està en marxa."

[notify.container_down.resolved_title]
other = "El contenidor {{.Subject}} torna a funcionar a {{.Server}}"
[notify.container_down.resolved_body]
other = "El contenidor {{.Subject}} de {{.Server}} torna a estar en marxa."

[notify.container_unhealthy.firing_title]
other = "[{{.Severity}}] El contenidor {{.Subject}} no està saludable a {{.Server}}"
[notify.container_unhealthy.firing_body]
other = "La comprovació de salut de {{.Subject}}{{if .Stack}} (stack {{.Stack}}){{end}} a {{.Server}} està fallant."

[notify.container_unhealthy.resolved_title]
other = "El contenidor {{.Subject}} torna a estar saludable a {{.Server}}"
[notify.container_unhealthy.resolved_body]
other = "La comprovació de salut de {{.Subject}} a {{.Server}} torna a passar."

[notify.check_failed.firing_title]
other = "[{{.Severity}}] Comprovació fallida: {{.Subject}}"
[notify.check_failed.firing_body]
other = "La comprovació {{.Subject}} està fallant."

[notify.check_failed.resolved_title]
other = "La comprovació {{.Subject}} torna a funcionar"
[notify.check_failed.resolved_body]
other = "La comprovació {{.Subject}} torna a passar."

[notify.cert_expiry.firing_title]
other = "[{{.Severity}}] Certificat a punt de caducar: {{.Subject}}"
[notify.cert_expiry.firing_body]
other = "El certificat de {{.Subject}} {{if le .days 0}}ha caducat{{else}}caduca d'aquí a {{.days}} dies{{end}}."

[notify.cert_expiry.resolved_title]
other = "Certificat de {{.Subject}} renovat"
[notify.cert_expiry.resolved_body]
other = "El certificat de {{.Subject}} ja no està a punt de caducar."
